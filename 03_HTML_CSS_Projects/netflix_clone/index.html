<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <div class="overlay"></div>

        <div class="hero-content">
            <h1>Netflix</h1>
            <p>Unlimited movies, TV shows, and more.</p>

            <div class="buttons">
                <button class="play">▶ Play</button>
                <button class="info">More Info</button>
            </div>
        </div>
    </header>

    <section class="row">
        <h2>Popular</h2>

        <div class="row-posters">
            <img src="imgs/money hiest.jpg" alt="money hiest poster">
            <img src="imgs/wednesday.jpg" alt="wednesday poster">
            <img src="imgs/witcher.jpg" alt="witcher poster">
            <img src="imgs/one piece.jpg" alt="one piece poster">
            <img src="imgs/squid game.jpg" alt="squid game poster">
            <img src="imgs/devil may cry.jpg" alt="devil may cry poster">
            <img src="imgs/emily rude.jpg" alt="emily rude poster">
            <img src="imgs/evanecencce.jpg" alt="evanecencce poster">
            <img src="imgs/katherin.jpg" alt="katherin poster">
            <img src="imgs/lera above.jpg" alt="lera above poster">
            <img src="imgs/outer banks.jpg" alt="outer banks poster">
            <img src="imgs/peaky blinders.jpg" alt="peaky blinders poster">
            <img src="imgs/stranger things.jpg" alt="stranger things poster">
        </div>
    </section>
</body>
</html>
