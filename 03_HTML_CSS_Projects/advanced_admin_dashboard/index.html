<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Dashboard UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar" id="sidebar">
            <h2>Dashboard</h2>
            <ul>
                <li>Dashboard</li>
                <li>Users</li>
                <li>Analytics</li>
                <li>Settings</li>
            </ul>
        </aside>

        <div class="main">
            <div class="topbar">
                <button id="toggleBtn">☰</button>
                <h2>Admin Panel</h2>
            </div>

            <div class="cards">
                <div class="card">
                    <h3>Users</h3>
                    <p>1200</p>
                </div>

                <div class="card">
                    <h3>Revenue</h3>
                    <p>$8,040</p>
                </div>
                
                <div class="card">
                    <h3>Orders</h3>
                    <p>320</p>
                </div>
            </div>

            <div class="table-section">
                <h3>Users</h3>
                <table>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                    </tr>

                    <tr>
                        <td>Yash</td>
                        <td>yash@gmail.com</td>
                        <td>Active</td>
                    </tr>

                    <tr>
                        <td>Aditya</td>
                        <td>aditya@gmail.com</td>
                        <td>Inactive</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
